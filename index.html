<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Justificativas - Shopee</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f5f5f5;min-height:100vh}.header{background:linear-gradient(135deg,#EE4D2D,#D73A1F);color:#fff;padding:20px;text-align:center}.header h1{font-size:20px}.header p{font-size:13px;opacity:.9;margin-top:4px}.container{max-width:600px;margin:0 auto;padding:20px}.search-box{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:20px}.search-box label{display:block;font-weight:600;color:#333;margin-bottom:10px}.search-row{display:flex;gap:10px}.search-row input{flex:1;padding:14px;border:2px solid #e0e0e0;border-radius:8px;font-size:16px;outline:none}.search-row input:focus{border-color:#EE4D2D}.search-row button{padding:14px 24px;background:#EE4D2D;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}.search-row button:disabled{background:#ccc}.alert-banner{background:#FFF3CD;border-left:4px solid #FF9800;border-radius:8px;padding:16px;margin-bottom:20px;display:none}.alert-banner.danger{background:#FDECEA;border-left-color:#D32F2F}.alert-banner .alert-text{font-size:14px;color:#333;line-height:1.5}.alert-banner .alert-text strong{color:#D32F2F}.driver-info{background:#fff;border-radius:12px;padding:16px;margin-bottom:20px;display:none}.driver-info h3{color:#333}.driver-info span{color:#777;font-size:13px}.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);border-left:4px solid #EE4D2D}.card.justified{border-left-color:#4CAF50;opacity:.7}.card-header{display:flex;justify-content:space-between;margin-bottom:12px}.card-date{font-size:13px;color:#EE4D2D;font-weight:600;background:#FFF0ED;padding:4px 10px;border-radius:20px}.card.justified .card-date{color:#4CAF50;background:#E8F5E9}.card-status{font-size:12px;padding:4px 10px;border-radius:20px;font-weight:600}.status-pending{background:#FFF3CD;color:#E65100}.status-done{background:#E8F5E9;color:#2E7D32}.card-body p{font-size:14px;color:#555;margin-bottom:8px}.card-body p strong{color:#333}.card-body .occurrence{background:#FFF8E1;border-radius:8px;padding:10px;margin:10px 0;font-size:13px;color:#E65100;border:1px solid #FFE082}.justification-area{margin-top:12px}.justification-area textarea{width:100%;min-height:80px;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;font-family:inherit;resize:vertical;outline:none}.justification-area textarea:focus{border-color:#EE4D2D}.justification-area button{margin-top:10px;width:100%;padding:12px;background:#EE4D2D;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}.justification-area button:disabled{background:#ccc}.justified-text{background:#E8F5E9;border-radius:8px;padding:10px;margin-top:10px;font-size:13px;color:#2E7D32;border:1px solid #C8E6C9}.loading{text-align:center;padding:40px;display:none}.loading .spinner{width:40px;height:40px;border:4px solid #f3f3f3;border-top:4px solid #EE4D2D;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}@keyframes spin{0%{transform:rotate(0)}to{transform:rotate(360deg)}}.empty-state{text-align:center;padding:40px;display:none}.empty-state .icon{font-size:48px;margin-bottom:12px}.results-container{display:none}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:14px 24px;border-radius:8px;font-size:14px;z-index:1000;display:none}.toast.success{background:#2E7D32}.toast.error{background:#D32F2F}.warning-box{background:#FDECEA;border:1px solid #FFCDD2;border-radius:8px;padding:14px;margin-bottom:16px;display:none}.warning-box p{font-size:13px;color:#C62828;line-height:1.5}</style>
</head>
<body>
<div class="header"><h1>Central de Justificativas</h1><p>Sistema de Ocorrencias - Shopee Xpress</p></div>
<div class="container">
<div class="search-box"><label>Digite seu ID de Motorista</label><div class="search-row"><input type="text" id="did" placeholder="Ex: 3666540" inputmode="numeric"><button id="sbtn" onclick="search()">Buscar</button></div></div>
<div id="ab" class="alert-banner"><span class="alert-text" id="at"></span></div>
<div id="wb" class="warning-box"><p><strong>Atencao:</strong> Se a mesma ocorrencia seguir por <strong>4 dias consecutivos</strong>, o motorista pode sofrer <strong>remocao da loja ou da rota</strong>.</p></div>
<div id="di" class="driver-info"><h3 id="dn"></h3><span id="dd"></span></div>
<div id="ld" class="loading"><div class="spinner"></div><p>Buscando...</p></div>
<div id="es" class="empty-state"><div class="icon">OK</div><p>Nenhuma justificativa encontrada para este ID.</p></div>
<div id="rc" class="results-container"></div>
</div>
<div id="toast" class="toast"></div>
<script>
const U='https://script.google.com/a/macros/shopee.com/s/AKfycbxL2fXICFd1VxEKDVCw_ggjl365dgMBsuo-W13IB1_4NyxCs57AozYI4Ri78FWDRYrH/exec';
document.getElementById('did').addEventListener('keypress',e=>{if(e.key==='Enter')search()});
function toast(m,t){const s=document.getElementById('toast');s.textContent=m;s.className='toast '+t;s.style.display='block';setTimeout(()=>s.style.display='none',3500)}
function hide(){['ld','es','rc','ab','di','wb'].forEach(i=>document.getElementById(i).style.display='none')}
async function search(){const id=document.getElementById('did').value.trim();const b=document.getElementById('sbtn');if(!id){toast('Digite um ID','error');return}hide();document.getElementById('ld').style.display='block';b.disabled=true;b.textContent='Buscando...';try{const r=await fetch(U+'?action=get&driverId='+encodeURIComponent(id),{redirect:'follow'});const d=await r.json();document.getElementById('ld').style.display='none';b.disabled=false;b.textContent='Buscar';if(!d.success){toast(d.error||'Erro','error');return}if(!d.data.length){document.getElementById('es').style.display='block';return}render(d)}catch(e){document.getElementById('ld').style.display='none';b.disabled=false;b.textContent='Buscar';toast('Erro de conexao','error')}}
function render(data){const items=data.data,dn=data.driverName||'',did=items[0].driverId;if(dn){document.getElementById('dn').textContent=dn;document.getElementById('dd').textContent='ID: '+did;document.getElementById('di').style.display='block'}const p=items.filter(i=>!i.justification||!i.justification.trim()),j=items.filter(i=>i.justification&&i.justification.trim());if(p.length){const ab=document.getElementById('ab'),at=document.getElementById('at');ab.style.display='block';ab.className=p.length>=3?'alert-banner danger':'alert-banner';at.innerHTML='Voce possui <strong>'+p.length+' justificativa(s) pendente(s)</strong> e tem apenas <strong>1 dia</strong> para responde-las.'+(p.length>=3?' <strong>URGENTE!</strong>':'');document.getElementById('wb').style.display='block'}const c=document.getElementById('rc');c.innerHTML='';[...p,...j].forEach(item=>{const ip=!item.justification||!item.justification.trim();const card=document.createElement('div');card.className='card'+(ip?'':' justified');card.innerHTML='<div class="card-header"><span class="card-date">'+item.date+'</span><span class="card-status '+(ip?'status-pending':'status-done')+'">'+(ip?'Pendente':'Justificado')+'</span></div><div class="card-body"><p><strong>Loja:</strong> '+item.store+'</p><p><strong>Endereco:</strong> '+item.address+'</p><div class="occurrence"><strong>Ocorrencia:</strong> '+item.occurrence+'</div>'+(ip?'<div class="justification-area"><textarea id="j'+item.row+'" placeholder="Digite sua justificativa..."></textarea><button onclick="submit(\''+item.driverId+'\','+item.row+')" id="b'+item.row+'">Enviar Justificativa</button></div>':'<div class="justified-text"><strong>Justificativa:</strong> '+item.justification+'</div>')+'</div>';c.appendChild(card)});c.style.display='block'}
async function submit(did,row){const ta=document.getElementById('j'+row),btn=document.getElementById('b'+row),j=ta.value.trim();if(!j){toast('Digite uma justificativa','error');ta.focus();return}btn.disabled=true;btn.textContent='Enviando...';try{const r=await fetch(U+'?action=submit&driverId='+encodeURIComponent(did)+'&row='+row+'&justification='+encodeURIComponent(j),{redirect:'follow'});const d=await r.json();if(d.success){toast('Justificativa enviada!','success');setTimeout(search,1000)}else{toast(d.error||'Erro','error');btn.disabled=false;btn.textContent='Enviar Justificativa'}}catch(e){toast('Erro de conexao','error');btn.disabled=false;btn.textContent='Enviar Justificativa'}}
</script>
</body>
</html>
