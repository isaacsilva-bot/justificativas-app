<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Justificativas - Shopee Xpress</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f5f5f5;min-height:100vh}
.header{background:linear-gradient(135deg,#EE4D2D,#D73A1F);color:#fff;padding:20px;text-align:center}
.header h1{font-size:20px}.header p{font-size:13px;opacity:.9;margin-top:4px}
.container{max-width:600px;margin:0 auto;padding:20px}
.search-box{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:20px}
.search-box label{display:block;font-weight:600;color:#333;margin-bottom:10px}
.search-row{display:flex;gap:10px}
.search-row input{flex:1;padding:14px;border:2px solid #e0e0e0;border-radius:8px;font-size:16px;outline:none}
.search-row input:focus{border-color:#EE4D2D}
.search-row button{padding:14px 24px;background:#EE4D2D;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
.search-row button:hover{background:#D73A1F}
.search-row button:disabled{background:#ccc;cursor:not-allowed}
.alert-banner{background:#FFF3CD;border-left:4px solid #FF9800;border-radius:8px;padding:16px;margin-bottom:20px;display:none}
.alert-banner.danger{background:#FDECEA;border-left-color:#D32F2F}
.alert-banner .alert-text{font-size:14px;color:#333;line-height:1.5}
.alert-banner .alert-text strong{color:#D32F2F}
.driver-info{background:#fff;border-radius:12px;padding:16px;margin-bottom:20px;display:none}
.driver-info h3{color:#333}.driver-info span{color:#777;font-size:13px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);border-left:4px solid #EE4D2D}
.card.justified{border-left-color:#4CAF50;opacity:.7}
.card-header{display:flex;justify-content:space-between;margin-bottom:12px}
.card-date{font-size:13px;color:#EE4D2D;font-weight:600;background:#FFF0ED;padding:4px 10px;border-radius:20px}
.card.justified .card-date{color:#4CAF50;background:#E8F5E9}
.card-status{font-size:12px;padding:4px 10px;border-radius:20px;font-weight:600}
.status-pending{background:#FFF3CD;color:#E65100}
.status-done{background:#E8F5E9;color:#2E7D32}
.card-body p{font-size:14px;color:#555;margin-bottom:8px}
.card-body p strong{color:#333}
.card-body .occurrence{background:#FFF8E1;border-radius:8px;padding:10px;margin:10px 0;font-size:13px;color:#E65100;border:1px solid #FFE082}
.justify-area{margin-top:12px}
.justify-area textarea{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;resize:vertical;min-height:80px;outline:none;font-family:inherit}
.justify-area textarea:focus{border-color:#EE4D2D}
.btn-justify{display:block;margin-top:8px;width:100%;padding:12px;background:#EE4D2D;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;text-align:center}
.btn-justify:hover{background:#D73A1F}
.btn-justify:disabled{background:#ccc;cursor:not-allowed}
.justified-text{background:#E8F5E9;border-radius:8px;padding:10px;margin-top:10px;font-size:13px;color:#2E7D32;border:1px solid #C8E6C9}
.loading{text-align:center;padding:40px;display:none}
.loading .spinner{width:40px;height:40px;border:4px solid #f3f3f3;border-top:4px solid #EE4D2D;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{0%{transform:rotate(0)}to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:40px;display:none}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.results-container{display:none}
.warning-box{background:#FDECEA;border:1px solid #FFCDD2;border-radius:8px;padding:14px;margin-bottom:16px;display:none}
.warning-box p{font-size:13px;color:#C62828;line-height:1.5}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:14px 24px;border-radius:8px;font-size:14px;z-index:1000;display:none}
.toast.success{background:#2E7D32}.toast.error{background:#D32F2F}
</style>
</head>
<body>
<div class="header"><h1>Central de Justificativas</h1><p>Sistema de Ocorrencias - Shopee Xpress</p></div>
<div class="container">
<div class="search-box"><label>Digite seu ID de Motorista</label><div class="search-row"><input type="text" id="did" placeholder="Ex: 3666540" inputmode="numeric"><button id="sbtn" onclick="search()">Buscar</button></div></div>
<div id="ab" class="alert-banner"><span class="alert-text" id="at"></span></div>
<div id="wb" class="warning-box"><p><strong>Atencao:</strong> Se a mesma ocorrencia seguir por <strong>4 dias consecutivos</strong>, o motorista pode sofrer <strong>remocao da loja ou da rota</strong>.</p></div>
<div id="di" class="driver-info"><h3 id="dn"></h3><span id="dd"></span></div>
<div id="ld" class="loading"><div class="spinner"></div><p>Buscando justificativas...</p></div>
<div id="es" class="empty-state"><div class="icon">OK</div><p>Nenhuma justificativa encontrada para este ID.</p></div>
<div id="rc" class="results-container"></div>
</div>
<div id="toast" class="toast"></div>
<script>
var SHEET_ID='141zh30kgmtqq-OPcvIDgeZWM-G6yvTpw6bNFV7aZIvM';
var SHEET_GV='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?sheet=Analise%20App';
var FORM_POST='https://docs.google.com/forms/d/e/1FAIpQLSdMfEA0Hz0HZeYgl7zOq3mm9edHFeYXdwCZmQlGxG1__2pqTw/formResponse';
var EID='entry.946805376';
var EROW='entry.1635351128';
var EJUST='entry.1855686972';
var currentDriverId='';
document.getElementById('did').addEventListener('keypress',function(e){if(e.key==='Enter')search()});
function showToast(m,t){var s=document.getElementById('toast');s.textContent=m;s.className='toast '+(t||'');s.style.display='block';setTimeout(function(){s.style.display='none'},3500)}
function hideAll(){['ld','es','rc','ab','di','wb'].forEach(function(x){document.getElementById(x).style.display='none'})}
function search(){
var id=document.getElementById('did').value.trim();
var btn=document.getElementById('sbtn');
if(!id){showToast('Digite um ID de motorista','error');return}
currentDriverId=id;
hideAll();document.getElementById('ld').style.display='block';
btn.disabled=true;btn.textContent='Buscando...';
var url=SHEET_GV+'&tq='+encodeURIComponent("select * where A='"+id+"' or A="+id)+'&tqx=out:json';
fetch(url).then(function(r){return r.text()}).then(function(text){
document.getElementById('ld').style.display='none';
btn.disabled=false;btn.textContent='Buscar';
var json=text.replace(/^\/\*O_o\*\/\s*/,'').replace(/^google\.visualization\.Query\.setResponse\(/,'').replace(/\);?\s*$/,'');
var resp;
try{resp=JSON.parse(json)}catch(e){showToast('Erro ao processar dados','error');return}
if(resp.status!=='ok'||!resp.table||!resp.table.rows||resp.table.rows.length===0){document.getElementById('es').style.display='block';return}
var rows=resp.table.rows;var items=[];
for(var i=0;i<rows.length;i++){var r=rows[i].c;var dv='';if(r[1]&&r[1].f)dv=r[1].f;else if(r[1]&&r[1].v)dv=String(r[1].v);
items.push({row:i+2,id:r[0]?String(r[0].v):'',date:dv,store:r[2]?r[2].v||'':'',address:r[3]?r[3].v||'':'',occurrence:r[4]?r[4].v||'':'',driverName:r[5]?r[5].v||'':'',justification:r[6]?r[6].v||'':''})}
render(items,id);
}).catch(function(e){document.getElementById('ld').style.display='none';btn.disabled=false;btn.textContent='Buscar';showToast('Erro de conexao. Tente novamente.','error')})}
function render(items,sid){
if(!items.length){document.getElementById('es').style.display='block';return}
var dn=items[0].driverName;if(dn){document.getElementById('dn').textContent=dn;document.getElementById('dd').textContent='ID: '+sid;document.getElementById('di').style.display='block'}
var p=items.filter(function(i){return !i.justification||!i.justification.trim()});
var j=items.filter(function(i){return i.justification&&i.justification.trim()});
if(p.length>0){var ab=document.getElementById('ab'),at=document.getElementById('at');ab.style.display='block';ab.className=p.length>=3?'alert-banner danger':'alert-banner';at.innerHTML='Voce possui <strong>'+p.length+' justificativa(s) pendente(s)</strong> e tem apenas <strong>1 dia</strong> para responde-las.'+(p.length>=3?' <strong>URGENTE!</strong>':'');document.getElementById('wb').style.display='block'}
var c=document.getElementById('rc');c.innerHTML='';var all=p.concat(j);
for(var x=0;x<all.length;x++){var item=all[x];var ip=!item.justification||!item.justification.trim();var card=document.createElement('div');card.className='card'+(ip?'':' justified');
var html='<div class="card-header"><span class="card-date">'+item.date+'</span><span class="card-status '+(ip?'status-pending':'status-done')+'">'+(ip?'Pendente':'Justificado')+'</span></div><div class="card-body"><p><strong>Loja:</strong> '+item.store+'</p><p><strong>Endereco:</strong> '+item.address+'</p><div class="occurrence"><strong>Ocorrencia:</strong> '+item.occurrence+'</div>';
if(ip){html+='<div class="justify-area"><textarea id="ta_'+item.row+'" placeholder="Digite sua justificativa aqui..."></textarea><button class="btn-justify" id="bj_'+item.row+'" onclick="submitJust('+item.row+')">Enviar Justificativa</button></div>'}else{html+='<div class="justified-text"><strong>Justificativa:</strong> '+item.justification+'</div>'}
html+='</div>';card.innerHTML=html;c.appendChild(card)}c.style.display='block'}
function submitJust(row){
var ta=document.getElementById('ta_'+row);
var btn=document.getElementById('bj_'+row);
var text=ta.value.trim();
if(!text){showToast('Digite uma justificativa antes de enviar','error');ta.focus();return}
btn.disabled=true;btn.textContent='Enviando...';
var formData=new URLSearchParams();
formData.append(EID,currentDriverId);
formData.append(EROW,String(row));
formData.append(EJUST,text);
fetch(FORM_POST,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:formData.toString()}).then(function(){
showToast('Justificativa enviada com sucesso!','success');
btn.textContent='Enviado!';
ta.disabled=true;
ta.style.background='#E8F5E9';
setTimeout(function(){search()},2000);
}).catch(function(){
showToast('Erro ao enviar. Tente novamente.','error');
btn.disabled=false;btn.textContent='Enviar Justificativa';})}
</script>
</body>
</html>
